<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/article-video.css" />
  </head>
  <body>
    <section class="share">
      <div>
        <p>Follow me for more content like this, and share the article with your friends!</p>
      </div>

      <div class="share-action">
        <picture>
          <source media="(min-width: 768px)" srcset="assets/icon/article_share_arrow_desktop.svg" width="110" height="85" />
          <img class="share-arrow" src="assets/icon/article_share_arrow.svg" alt="" width="32" height="53" />
        </picture>

        <details class="share-details">
          <summary class="share-btn">
            <img class="share-icon-inside" src="assets/icon/article_share.svg" alt="" width="24" height="27" />
            <span>Share</span>
          </summary>

          <div class="share-content">
            <img src="assets/icon/article_shared_small.svg" alt="" width="16" height="18" />
            <div class="share-links">
              <a href="#" onclick="return false;" target="_blank">LinkedIn</a>
              <a href="#" onclick="return false;" target="_blank">WhatsApp</a>
            </div>
          </div>
        </details>
      </div>
    </section>
  </body>
</html>
