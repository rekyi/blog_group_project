<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy</title>
    <link rel="stylesheet" href="assets/css/global.css" />
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;

        background-color: #f8f9fa;
        color: var(--color-primary-green);

        padding: 1rem;

        display: flex;
        justify-content: center;
        align-items: center;

        @media (min-width: 768px) {
          padding: 2rem;
        }
      }

      .privacy-container {
        width: 100%;
        max-width: 600px;
        padding: 3rem 1rem;

        text-align: center;
        background-color: #ffffff;

        border-radius: 8px;
        box-shadow: 0 20px 24px rgba(0, 0, 0, 0.082);

        @media (min-width: 768px) {
          padding: 4rem 2rem;
        }
      }

      h1 {
        margin-bottom: 1.5rem;

        font-size: 1.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;

        @media (min-width: 768px) {
          font-size: 2rem;
          letter-spacing: 2px;
        }
      }

      p {
        margin-bottom: 2rem;
        font-size: 1.25rem;
        color: var(--color-text-main);
      }

      .deal-with-it {
        margin-bottom: 3rem;
        font-size: 1.5rem;
        font-weight: 500;
        color: var(--color-primary-green);
      }

      .btn-back {
        padding: 0.75rem 2.5rem;
        font-weight: 600;

        color: #ffffff;
        background-color: #1a1a1a;
        border-radius: 4px;
        text-decoration: none;
        display: inline-block;
        transition: transform 0.2s ease;

        &:hover {
          background-color: #333333;
          transform: translateY(-2px);
        }
      }
    </style>
  </head>
  <body>
    <div class="privacy-container">
      <h1>Privacy Policy</h1>
      <p>We track everything, read everything, and sell your data to the highest bidder.</p>
      <div class="deal-with-it">Deal with it.</div>
      <a href="javascript:history.back()" class="btn-back">I Accept.</a>
    </div>
  </body>
</html>
